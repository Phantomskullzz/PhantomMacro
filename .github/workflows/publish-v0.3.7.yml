name: Validate and publish private PhantomMacro v0.3.7

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.3.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 and validate launcher syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'autohotkey.zip'
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ahk')
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ahk') -Filter 'AutoHotkey64.exe' -Recurse | Select-Object -First 1
          if (!$exe) { throw 'AutoHotkey64.exe was not found in downloaded zip.' }
          $exe.FullName | Set-Content (Join-Path $env:RUNNER_TEMP 'ahkpath.txt')
          $err = Join-Path $env:RUNNER_TEMP 'ahk-validation-stderr.txt'
          $out = Join-Path $env:RUNNER_TEMP 'ahk-validation-stdout.txt'
          $script = Join-Path $env:GITHUB_WORKSPACE 'PhantomMacro.ahk'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('/ErrorStdOut=UTF-8', '/Validate', $script) -Wait -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          if (Test-Path $err) { Get-Content $err | Write-Host }
          if (Test-Path $out) { Get-Content $out | Write-Host }
          if ($process.ExitCode -ne 0) { throw "AHK validation failed with exit code $($process.ExitCode)." }

      - name: Verify PM branding, header spacing and themed update modal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = Get-Content GUI.ahk -Raw
          $launcher = Get-Content PhantomMacro.ahk -Raw
          if (!$gui.Contains('RenderHotkeyHeader()')) { throw 'Rounded header renderer is missing' }
          if (!$gui.Contains('CreateRoundRectRgn')) { throw 'Rounded GDI fill is missing' }
          if (!$gui.Contains('headerKeybindPic')) { throw 'Header binding control missing' }
          if (!$gui.Contains('"x106 y2 w300 h20"')) { throw 'Header layout mismatch' }
          if (!$gui.Contains('width := 300, height := 20')) { throw 'Header image size does not match control' }
          if (!$gui.Contains('pillWidth := i = 3 ? 96 : 88')) { throw 'Pill widths are incorrect' }
          if (!$gui.Contains('"x96 y0 w428 h24 Background"')) { throw 'Full-width dark header is missing' }
          if (!$gui.Contains('Gui("-MaximizeBox -Caption", "PM Macro")')) { throw 'PM title missing' }
          if (!$gui.Contains('"x120 y36 w300')) { throw 'Lower macro selection row missing' }
          $updater = Get-Content UpdateManager.ahk -Raw
          if (!$updater.Contains('UpdateDialogMessage(')) { throw 'Owned dialogs helper is missing' }
          if (!$updater.Contains('options " Owner" g.Hwnd')) { throw 'Update prompt is not parented to the main GUI' }
          if (!$updater.Contains('ShowUpdateAvailableDialog(release)')) { throw 'Custom update popup missing' }
          if (!$updater.Contains('UpdateNotesPreview(notes)')) { throw 'Release notes preview missing' }
          if (!$updater.Contains('if ShowUpdateAvailableDialog(latest)')) { throw 'Custom update prompt not called' }
          if (!$updater.Contains('StartGitHubCommandAsync(')) { throw 'Nonblocking GitHub worker missing' }
          if (!$updater.Contains('SetTimer request.poll, 125')) { throw 'Asynchronous completion timer missing' }
          if ($updater.Contains('WScript.Shell").Exec')) { throw 'Legacy visible console runner remains' }
          if (!$launcher.Contains('global AppVersion := "0.3.7"')) { throw 'Version mismatch' }
          foreach ($file in @('Macro.ahk','UpdateManager.ahk','UpdateApply.ahk')) {
              if (!(Test-Path $file)) { throw "Missing application file: $file" }
          }

      - name: Validate hidden asynchronous updater source integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $updater = Get-Content UpdateManager.ahk -Raw
          $required = @(
              'StartGitHubCommandAsync(',
              'PollGitHubCommand(',
              'OnPrivateReleaseCheck(',
              'FinishPrivateReleaseDownload(',
              'Run(',
              'SetTimer request.poll, 125'
          )
          foreach ($item in $required) {
              if (!$updater.Contains($item)) { throw "Missing asynchronous updater component: $item" }
          }
          if ($updater.Contains('ComObject("WScript.Shell").Exec')) { throw 'Legacy blocking console runner found' }
          if ($updater.Contains('RunWait(command')) { throw 'Legacy blocking GitHub download found' }
          if ($updater.Contains('Integer(Trim(FileRead(request.done')) { throw 'Crash-prone exit-code conversion remains' }
          if (!$updater.Contains('ParseGitHubExitCode(raw)')) { throw 'Defensive numeric parsing is missing' }
          $installer = Get-Content UpdateApply.ahk -Raw
          if (!$installer.Contains('oldPid := A_Args[3] + 0')) { throw 'Installer PID conversion was not fixed' }

      - name: Validate AHK regression test script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Content (Join-Path $env:RUNNER_TEMP 'ahkpath.txt') -Raw).Trim()
          $test = Join-Path $env:GITHUB_WORKSPACE 'tests\updater-smoke.ahk'
          $err = Join-Path $env:RUNNER_TEMP 'test-validation-stderr.txt'
          $out = Join-Path $env:RUNNER_TEMP 'test-validation-stdout.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('/ErrorStdOut=UTF-8', '/Validate', $test) -Wait -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          if (Test-Path $err) { Get-Content $err | Write-Host }
          if (Test-Path $out) { Get-Content $out | Write-Host }
          if ($process.ExitCode -ne 0) { throw "Regression script failed to parse (exit $($process.ExitCode))" }

      - name: Exercise exit-code parser and hidden GitHub CLI on Windows
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Content (Join-Path $env:RUNNER_TEMP 'ahkpath.txt') -Raw).Trim()
          $test = Join-Path $env:GITHUB_WORKSPACE 'tests\updater-smoke.ahk'
          $log = Join-Path $env:GITHUB_WORKSPACE 'tests\updater-test-status.txt'
          $err = Join-Path $env:RUNNER_TEMP 'test-runtime-stderr.txt'
          $out = Join-Path $env:RUNNER_TEMP 'test-runtime-stdout.txt'
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:GITHUB_WORKSPACE -ArgumentList @('/ErrorStdOut=UTF-8', $test) -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          if (-not $process.WaitForExit(25000)) {
              try { $process.Kill() } catch {}
              if (Test-Path $log) { Get-Content $log | Write-Host }
              if (Test-Path $err) { Get-Content $err | Write-Host }
              throw "Updater regression test timed out (may be an AHK error dialog)."
          }
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if (Test-Path $err) { Get-Content $err | Write-Host }
          if (Test-Path $out) { Get-Content $out | Write-Host }
          if ($process.ExitCode -ne 0) { throw "Updater regression failed (exit $($process.ExitCode))." }
          if (!(Test-Path $log) -or !(Select-String -Path $log -Pattern 'PASS' -Quiet)) { throw 'Updater test did not record PASS' }

      - name: Create release ZIP from validated source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = ["PhantomMacro.ahk", "GUI.ahk", "Macro.ahk", "UpdateManager.ahk", "UpdateApply.ahk"]
          for path in files:
              assert Path(path).is_file(), path
          launcher = Path("PhantomMacro.ahk").read_text(encoding="utf-8-sig")
          gui = Path("GUI.ahk").read_text(encoding="utf-8-sig")
          assert 'global AppVersion := "0.3.7"' in launcher
          assert "RenderHotkeyHeader" in gui
          assert "headerKeybindPic" in gui
          with ZipFile("PhantomMacro_Update.zip", "w", ZIP_DEFLATED) as z:
              for path in files:
                  z.write(path, arcname=path)
          with ZipFile("PhantomMacro_Update.zip") as z:
              assert z.testzip() is None
          '@ | python -

      - name: Publish private GitHub Release v0.3.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.3.7 2>$null) {
              gh release upload v0.3.7 PhantomMacro_Update.zip --clobber
          } else {
              gh release create v0.3.7 PhantomMacro_Update.zip --target $env:GITHUB_SHA --title 'PhantomMacro v0.3.7' --notes 'Fix malformed GitHub exit-code handling and prevent timer crashes; improve private updater error handling and installer rollback. Existing settings and presets remain intact.' --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub private release publication failed.' }
